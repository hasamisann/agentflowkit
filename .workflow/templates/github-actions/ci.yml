name: CI

on:
  pull_request:
  push:
    branches:
      - __DEFAULT_BRANCH__

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail until customized
        run: |
          echo "Customize this template during /plan-tasks before enabling CI." >&2
          exit 1
