# Review-gate-only `codex exec` settings. This file does not configure interactive Codex CLI sessions.
model = "gpt-5.4"
sandbox = "read-only"
output_schema = ".workflow/review/codex-review-schema.json"
prompt_transport = "stdin"
document_review_mode = "inline-artifact"
blocking_severities = ["critical", "major"]

[[review_stages]]
label = "screening"
max_review_turns = 10
reviewer_labels = ["baseline-high", "edge-state-verify-high"]

[[review_stages]]
label = "final-xhigh"
max_review_turns = "unlimited"
reviewer_labels = ["baseline-xhigh"]

[[reviewer_profiles]]
label = "baseline-high"
model_reasoning_effort = "high"

[[reviewer_profiles]]
label = "baseline-xhigh"
model_reasoning_effort = "xhigh"

[[reviewer_profiles]]
label = "edge-state-verify-high"
model_reasoning_effort = "high"
document_prompt_lens = "Prioritize edge-case workflow violations, status transitions relative to the documented phase, missing dependencies or phase gates, and verify completeness first. Do not require terminal statuses before their documented transition point. Keep the same evidence standard and still report any other concrete findings."
implementation_prompt_lens = "Prioritize invalid state transitions, queued or pending or cleanup coverage gaps, verify-command completeness, and done-condition evidence first. Do not require terminal statuses before their documented transition point. Keep the same evidence standard and still report any other concrete findings."
